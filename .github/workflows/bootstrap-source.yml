name: Bootstrap source

on:
  push:
    branches: ["main"]
    paths:
      - "minsrc.b64.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and extract project source
        shell: bash
        run: |
          set -euo pipefail
          cat minsrc.b64.part* | tr -d '\n\r' | base64 -d > minsrc.zip
          unzip -t minsrc.zip
          rm -rf .bootstrap-tmp
          mkdir .bootstrap-tmp
          unzip -q minsrc.zip -d .bootstrap-tmp
          cp -a .bootstrap-tmp/. .
          rm -rf .bootstrap-tmp minsrc.zip minsrc.b64.part* project-source.zip project-source.b64.part*
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish Image SVG Studio v0.2.10 source"
          git push
