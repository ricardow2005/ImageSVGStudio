name: Bootstrap public source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish clean source tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract source package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=".bootstrap/ImageSVGStudio-v0.2.10-source.zip"
          PREPARED="/tmp/ImageSVGStudio-v0.2.10-source"
          EXPANDED="/tmp/ImageSVGStudio-v0.2.10-expanded"

          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          rm -rf "$PREPARED" "$EXPANDED"
          mkdir -p "$PREPARED" "$EXPANDED"
          unzip -q "$ARCHIVE" -d "$EXPANDED"

          if [ -f "$EXPANDED/main.go" ]; then
            SOURCE_ROOT="$EXPANDED"
          elif [ -f "$EXPANDED/ImageSVGStudio-v0.2.10/main.go" ]; then
            SOURCE_ROOT="$EXPANDED/ImageSVGStudio-v0.2.10"
          else
            echo "Archive contents:"
            find "$EXPANDED" -maxdepth 3 -type f -print
            echo "main.go not found in source archive."
            exit 1
          fi

          cp -a "$SOURCE_ROOT"/. "$PREPARED"/
          test -f "$PREPARED/main.go"
          test -f "$PREPARED/go.mod"
          test -f "$PREPARED/frontend/package.json"

          cp LICENSE "$PREPARED/LICENSE"
          mkdir -p "$PREPARED/.github/workflows"
          cp .github/workflows/release.yml "$PREPARED/.github/workflows/release.yml"

          rm -f "$PREPARED/.github/workflows/bootstrap.yml" "$PREPARED/.github/workflows/bootstrap-source.yml"
          rm -rf "$PREPARED/.bootstrap"
          find "$PREPARED" -maxdepth 1 \( -name 'payload.part*' -o -name 'project-source.b64.part*' -o -name 'source.b64.part*' -o -name 'minsrc*.b64.part*' -o -name 'bootstrap.ready' -o -name 'project-source.zip' \) -delete

          echo "Prepared source files:"
          find "$PREPARED" -maxdepth 2 -type f -print | sort

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ImageSVGStudio-v0.2.10-source/. .

          git add -A
          git commit -m "feat: publish Image SVG Studio v0.2.10 source"
          git push origin HEAD:main

      - name: Create v0.2.10 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f -a v0.2.10 -m "Image SVG Studio v0.2.10"
          git push origin refs/tags/v0.2.10 --force
