name: Bootstrap Source and Initial Release

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    name: Publish complete source and v0.2.10 Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand complete source tree
        shell: pwsh
        run: |
          $archive = ".bootstrap/ImageSVGStudio-v0.2.10-source.zip"
          $target = ".bootstrap/extracted"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Expand-Archive -Path $archive -DestinationPath $target -Force
          Get-ChildItem $target -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination . -Recurse -Force
          }
          Remove-Item ".bootstrap" -Recurse -Force
          Remove-Item ".github/workflows/bootstrap.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/bootstrap-source.yml" -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Filter "minsrc*.b64.part*" -Force -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path . -Filter "project-source.b64.part*" -Force -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item "project-source.zip" -Force -ErrorAction SilentlyContinue

      - name: Commit complete source tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: publish Image SVG Studio v0.2.10 source"
            git push origin HEAD:main
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = "0.2.10"
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          wails build -platform windows/amd64 -clean -ldflags "-X image-svg-studio/version.Version=$version -X image-svg-studio/version.Commit=$commit -X image-svg-studio/version.BuildDate=$date"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "dist/ImageSVGStudio-$version-windows-amd64.exe"
          Copy-Item build/bin/ImageSVGStudio.exe $exe
          Compress-Archive -Path $exe -DestinationPath "dist/ImageSVGStudio-$version-windows-amd64.zip" -Force
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Out-File "dist/ImageSVGStudio-$version-windows-amd64.sha256" -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSVGStudio-0.2.10-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release v0.2.10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.10"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          } else {
            gh release create $tag dist/* --title "Image SVG Studio v0.2.10" --generate-notes --target main
          }
