name: Bootstrap public source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"
      - "payload.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish clean source tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq -w 0 12); do
            test -f "payload.part$i"
          done

          cat payload.part{00..12} | tr -d '\r\n' | base64 --decode > /tmp/ImageSVGStudio-v0.2.10-source.zip

          EXPECTED="fe4ada36c5cfb917b8f7f1f86ed7a8f4f0255f323f78c335b0d9965f8d74600e"
          ACTUAL="$(sha256sum /tmp/ImageSVGStudio-v0.2.10-source.zip | awk '{print $1}')"
          echo "Archive SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t /tmp/ImageSVGStudio-v0.2.10-source.zip

          PREPARED="/tmp/ImageSVGStudio-v0.2.10-source"
          rm -rf "$PREPARED"
          mkdir -p "$PREPARED"
          unzip -q /tmp/ImageSVGStudio-v0.2.10-source.zip -d "$PREPARED"

          test -f "$PREPARED/main.go"
          test -f "$PREPARED/go.mod"
          test -f "$PREPARED/frontend/package.json"
          test -f "$PREPARED/LICENSE"

          # Keep the latest release workflow from main.
          mkdir -p "$PREPARED/.github/workflows"
          cp .github/workflows/release.yml "$PREPARED/.github/workflows/release.yml"

          # Never publish bootstrap staging files.
          rm -f "$PREPARED/.github/workflows/bootstrap.yml" "$PREPARED/.github/workflows/bootstrap-source.yml"
          rm -rf "$PREPARED/.bootstrap"

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ImageSVGStudio-v0.2.10-source/. .

          git add -A
          git commit -m "feat: publish Image SVG Studio v0.2.10 source"
          git push origin HEAD:main

      - name: Create v0.2.10 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f -a v0.2.10 -m "Image SVG Studio v0.2.10"
          git push origin refs/tags/v0.2.10 --force
