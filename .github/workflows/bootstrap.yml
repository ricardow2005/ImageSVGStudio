name: Bootstrap public source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish clean source tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil
          import zipfile

          BASE64_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"

          def git_blob_sha(text: str) -> str:
              data = text.encode("ascii")
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()

          parts = {
              path.name: path.read_text(encoding="utf-8").strip()
              for path in Path(".").glob("payload.part*")
          }

          required = {
              "payload.part00", "payload.part01", "payload.part02",
              "payload.part04", "payload.part05", "payload.part06",
              "payload.part07", "payload.part08", "payload.part09",
              "payload.part10", "payload.part11", "payload.part12",
          }
          missing = sorted(required.difference(parts))
          if missing:
              raise SystemExit(f"Missing bootstrap payload files: {missing}")

          # part09 contains the two 6000-character chunks that originally belonged
          # to part03 and part09. Identify them by their Git blob SHA.
          combined = parts["payload.part09"]
          if len(combined) != 12000:
              raise SystemExit(f"Unexpected payload.part09 length: {len(combined)}")

          halves = [combined[:6000], combined[6000:]]
          expected_part03 = "4801f09aeab83ae81e2c6672a9a2ef987841e234"
          expected_part09 = "0caf9899d484285cdf536529c38e5ad267389cb9"

          part03 = next((item for item in halves if git_blob_sha(item) == expected_part03), None)
          part09 = next((item for item in halves if git_blob_sha(item) == expected_part09), None)
          if part03 is None or part09 is None:
              raise SystemExit("Could not recover payload part03/part09 from the merged chunk.")

          # part08 lost exactly one Base64 character during the first upload.
          # Recover it deterministically against the expected Git blob SHA.
          broken08 = parts["payload.part08"]
          expected_part08 = "ad6cc62c121c573def4ad8b532bdd712051addf1"
          repaired08 = None

          if git_blob_sha(broken08) == expected_part08:
              repaired08 = broken08
          else:
              if len(broken08) != 5999:
                  raise SystemExit(f"Unexpected payload.part08 length: {len(broken08)}")
              for position in range(len(broken08) + 1):
                  prefix = broken08[:position]
                  suffix = broken08[position:]
                  for character in BASE64_ALPHABET:
                      candidate = prefix + character + suffix
                      if git_blob_sha(candidate) == expected_part08:
                          repaired08 = candidate
                          print(f"Recovered payload.part08 at position {position} with {character!r}")
                          break
                  if repaired08 is not None:
                      break

          if repaired08 is None:
              raise SystemExit("Could not repair payload.part08.")

          ordered = [
              parts["payload.part00"],
              parts["payload.part01"],
              parts["payload.part02"],
              part03,
              parts["payload.part04"],
              parts["payload.part05"],
              parts["payload.part06"],
              parts["payload.part07"],
              repaired08,
              part09,
              parts["payload.part10"],
              parts["payload.part11"],
              parts["payload.part12"],
          ]

          encoded = "".join(ordered)
          archive_bytes = base64.b64decode(encoded, validate=True)
          actual_hash = hashlib.sha256(archive_bytes).hexdigest()
          expected_hash = "fe4ada36c5cfb917b8f7f1f86ed7a8f4f0255f323f78c335b0d9965f8d74600e"
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Source archive hash mismatch: expected {expected_hash}, got {actual_hash}"
              )

          archive = Path("/tmp/ImageSVGStudio-v0.2.10-source.zip")
          prepared = Path("/tmp/ImageSVGStudio-v0.2.10-source")
          archive.write_bytes(archive_bytes)
          shutil.rmtree(prepared, ignore_errors=True)
          prepared.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as package:
              package.extractall(prepared)

          for required_file in (
              "main.go",
              "LICENSE",
              ".github/workflows/release.yml",
          ):
              if not (prepared / required_file).exists():
                  raise SystemExit(f"Prepared source tree is missing {required_file}")

          print(f"Source archive verified: {actual_hash}")
          PY

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ImageSVGStudio-v0.2.10-source/. .

          git add -A
          git commit -m "feat: publish Image SVG Studio v0.2.10 source"
          git push origin HEAD:main

      - name: Create v0.2.10 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f -a v0.2.10 -m "Image SVG Studio v0.2.10"
          git push origin refs/tags/v0.2.10 --force
