name: Bootstrap public source and Windows release

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap.ready"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish source and Windows v0.2.10 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct public source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path . -Filter "payload.part*" | Sort-Object Name
          if (!$parts -or $parts.Count -ne 13) {
            throw "Expected 13 payload chunks, found $($parts.Count)."
          }

          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append((Get-Content $part.FullName -Raw).Trim())
          }

          $archive = Join-Path $env:RUNNER_TEMP "ImageSVGStudio-v0.2.10-public-source.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($builder.ToString()))

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "fe4ada36c5cfb917b8f7f1f86ed7a8f4f0255f323f78c335b0d9965f8d74600e"
          if ($actualHash -ne $expectedHash) {
            throw "Source archive hash mismatch. Expected $expectedHash, got $actualHash."
          }

          $expanded = Join-Path $env:RUNNER_TEMP "ImageSVGStudio-expanded"
          $prepared = Join-Path $env:RUNNER_TEMP "ImageSVGStudio-prepared"
          Remove-Item $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $prepared -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          New-Item -ItemType Directory -Force -Path $prepared | Out-Null
          Expand-Archive -Path $archive -DestinationPath $expanded -Force

          Get-ChildItem -Path $expanded -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination $prepared -Recurse -Force
          }

          if (!(Test-Path (Join-Path $prepared "main.go"))) {
            throw "Prepared source tree is invalid: main.go was not found."
          }
          if (!(Test-Path (Join-Path $prepared "LICENSE"))) {
            throw "Prepared source tree is invalid: MIT LICENSE was not found."
          }
          if (!(Test-Path (Join-Path $prepared ".github/workflows/release.yml"))) {
            throw "Prepared source tree is invalid: release workflow was not found."
          }

      - name: Commit complete public source tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $prepared = Join-Path $env:RUNNER_TEMP "ImageSVGStudio-prepared"
          $published = $false

          for ($attempt = 1; $attempt -le 8; $attempt++) {
            Write-Host "Publish attempt $attempt"
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }

            Get-ChildItem -Path . -Force | Where-Object { $_.Name -ne ".git" } | Remove-Item -Recurse -Force
            Get-ChildItem -Path $prepared -Force | ForEach-Object {
              Copy-Item $_.FullName -Destination . -Recurse -Force
            }

            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Source tree is already published."
              $published = $true
              break
            }

            git commit -m "feat: publish Image SVG Studio v0.2.10 source"
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            Write-Host "Remote changed during publish; retrying on top of latest main..."
            Start-Sleep -Seconds 2
          }

          if (!$published) {
            throw "Could not publish the source tree after multiple retries."
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = "0.2.10"
          $commit = (git rev-parse --short HEAD).Trim()
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')

          wails build -platform windows/amd64 -clean -ldflags "-X image-svg-studio/version.Version=$version -X image-svg-studio/version.Commit=$commit -X image-svg-studio/version.BuildDate=$date"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "dist/ImageSVGStudio-$version-windows-amd64.exe"
          Copy-Item build/bin/ImageSVGStudio.exe $exe
          Compress-Archive -Path $exe -DestinationPath "dist/ImageSVGStudio-$version-windows-amd64.zip" -Force
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Out-File "dist/ImageSVGStudio-$version-windows-amd64.sha256" -Encoding ascii -NoNewline

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSVGStudio-0.2.10-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release v0.2.10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.10"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          } else {
            gh release create $tag dist/* --title "Image SVG Studio v0.2.10" --generate-notes --target main
          }
