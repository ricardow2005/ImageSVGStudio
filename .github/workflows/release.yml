name: Windows Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a signed GitHub Release and attach the Windows build"
        required: true
        default: false
        type: boolean
      version:
        description: "Version override (example: 0.2.11). Leave blank to use version/version.go"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
  ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
  ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path version/version.go -Pattern 'Version\s*=\s*"([^"]+)"'
          if (!$versionLine) { throw "Version not found in version/version.go" }
          $version = $versionLine.Matches[0].Groups[1].Value

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}".Trim() -ne "") {
            $version = "${{ inputs.version }}".Trim().TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Image SVG Studio $version"

      - name: Detect Artifact Signing configuration
        id: signing
        shell: pwsh
        run: |
          $values = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )

          $enabled = $true
          foreach ($value in $values) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              $enabled = $false
              break
            }
          }

          if ($enabled) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Microsoft Artifact Signing is configured. The Windows executable will be signed."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Artifact Signing is not fully configured. The build will run, but no public GitHub Release will be created or updated."
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')

          wails build -platform windows/amd64 -clean -ldflags "-X image-svg-studio/version.Version=$version -X image-svg-studio/version.Commit=$commit -X image-svg-studio/version.BuildDate=$date"

          if (!(Test-Path "build/bin/ImageSVGStudio.exe")) {
            throw "Windows executable was not generated."
          }

      - name: Azure login for Artifact Signing
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable with Microsoft Artifact Signing
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\bin\ImageSVGStudio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Image SVG Studio
          description-url: https://github.com/ricardow2005/ImageSVGStudio

      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "build/bin/ImageSVGStudio.exe"
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

          if ($signature.Status -ne "Valid") {
            throw "The generated executable does not have a valid Authenticode signature. Status: $($signature.Status)"
          }

      - name: Package Windows release files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $exe = "dist/ImageSVGStudio-$version-windows-amd64.exe"
          Copy-Item build/bin/ImageSVGStudio.exe $exe
          Compress-Archive -Path $exe -DestinationPath "dist/ImageSVGStudio-$version-windows-amd64.zip" -Force
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Out-File "dist/ImageSVGStudio-$version-windows-amd64.sha256" -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSVGStudio-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Skip unsigned public release
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          Write-Warning "Public release skipped because Microsoft Artifact Signing is not configured. Configure the required GitHub secrets/variables and rerun the workflow."

      - name: Create or update signed GitHub Release
        if: steps.signing.outputs.enabled == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $title = "Image SVG Studio $tag"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          } else {
            gh release create $tag dist/* --title $title --generate-notes --target "${{ github.sha }}"
          }
