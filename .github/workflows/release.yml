name: Windows Build, Store MSIX & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a signed GitHub Release and attach the Windows build"
        required: true
        default: false
        type: boolean
      version:
        description: "Version override (example: 0.2.11). Leave blank to use version/version.go"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
  ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
  ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
  STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
  STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
  STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

jobs:
  windows:
    name: Windows x64 + Microsoft Store MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path version/version.go -Pattern 'Version\s*=\s*"([^"]+)"'
          if (!$versionLine) { throw "Version not found in version/version.go" }
          $version = $versionLine.Matches[0].Groups[1].Value

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}".Trim() -ne "") {
            $version = "${{ inputs.version }}".Trim().TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Image SVG Studio $version"

      - name: Resolve Microsoft Store identity
        id: store
        shell: pwsh
        run: |
          $packageName = "$env:STORE_PACKAGE_NAME".Trim()
          $publisher = "$env:STORE_PUBLISHER".Trim()
          $publisherDisplayName = "$env:STORE_PUBLISHER_DISPLAY_NAME".Trim()

          $configured = $true
          if ([string]::IsNullOrWhiteSpace($packageName) -or
              [string]::IsNullOrWhiteSpace($publisher) -or
              [string]::IsNullOrWhiteSpace($publisherDisplayName)) {
            $configured = $false
            $packageName = "OrganizzaTech.ImageSVGStudio"
            $publisher = "CN=OrganizzaTech"
            $publisherDisplayName = "OrganizzaTech"
            Write-Warning "Microsoft Store identity is not configured yet. A preview MSIX will be generated with placeholder identity values. Do not submit that package to Partner Center."
          } else {
            Write-Host "Microsoft Store identity loaded from repository variables."
          }

          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT
          "publisher_display_name=$publisherDisplayName" >> $env:GITHUB_OUTPUT

      - name: Detect Artifact Signing configuration
        id: signing
        shell: pwsh
        run: |
          $values = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )

          $enabled = $true
          foreach ($value in $values) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              $enabled = $false
              break
            }
          }

          if ($enabled) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Microsoft Artifact Signing is configured. The direct-download Windows executable will be signed."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Artifact Signing is not configured. The Microsoft Store MSIX can still be generated because the Store signs MSIX packages after certification. Direct GitHub EXE releases will remain disabled."
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')

          wails build -platform windows/amd64 -clean -ldflags "-X image-svg-studio/version.Version=$version -X image-svg-studio/version.Commit=$commit -X image-svg-studio/version.BuildDate=$date"

          if (!(Test-Path "build/bin/ImageSVGStudio.exe")) {
            throw "Windows executable was not generated."
          }

      - name: Azure login for Artifact Signing
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign direct-download executable with Microsoft Artifact Signing
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\bin\ImageSVGStudio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Image SVG Studio
          description-url: https://github.com/ricardow2005/ImageSVGStudio

      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "build/bin/ImageSVGStudio.exe"
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

          if ($signature.Status -ne "Valid") {
            throw "The generated executable does not have a valid Authenticode signature. Status: $($signature.Status)"
          }

      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist-store | Out-Null
          $msix = "dist-store/ImageSVGStudio-$version-store-x64.msix"

          ./scripts/build-msix.ps1 `
            -ExePath "build/bin/ImageSVGStudio.exe" `
            -Version $version `
            -OutputPath $msix `
            -PackageName '${{ steps.store.outputs.package_name }}' `
            -Publisher '${{ steps.store.outputs.publisher }}' `
            -PublisherDisplayName '${{ steps.store.outputs.publisher_display_name }}'

          (Get-FileHash $msix -Algorithm SHA256).Hash.ToLower() |
            Out-File "dist-store/ImageSVGStudio-$version-store-x64.sha256" -Encoding ascii -NoNewline

          @"
          Image SVG Studio - Microsoft Store package
          Version: $version
          Store identity configured: ${{ steps.store.outputs.configured }}
          Package/Identity/Name: ${{ steps.store.outputs.package_name }}
          Package/Identity/Publisher: ${{ steps.store.outputs.publisher }}
          Package/Properties/PublisherDisplayName: ${{ steps.store.outputs.publisher_display_name }}

          IMPORTANT:
          - If Store identity configured is false, this package is only a CI preview.
          - Before Partner Center submission, configure STORE_PACKAGE_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME with the exact values shown in Partner Center > Product management > Product identity.
          - The Microsoft Store signs/re-signs MSIX packages after certification. This MSIX does not need a CA-trusted signing certificate for Store submission.
          "@ | Set-Content "dist-store/STORE-IDENTITY.txt" -Encoding utf8

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSVGStudio-${{ steps.version.outputs.version }}-MicrosoftStore-MSIX
          path: dist-store/*
          if-no-files-found: error
          retention-days: 30

      - name: Package direct-download Windows files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $exe = "dist/ImageSVGStudio-$version-windows-amd64.exe"
          Copy-Item build/bin/ImageSVGStudio.exe $exe
          Compress-Archive -Path $exe -DestinationPath "dist/ImageSVGStudio-$version-windows-amd64.zip" -Force
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Out-File "dist/ImageSVGStudio-$version-windows-amd64.sha256" -Encoding ascii -NoNewline

      - name: Upload direct-download build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSVGStudio-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Microsoft Store package status
        shell: pwsh
        run: |
          if ("${{ steps.store.outputs.configured }}" -eq "true") {
            Write-Host "Store-ready MSIX generated. Upload the .msix from the MicrosoftStore-MSIX artifact to Partner Center."
          } else {
            Write-Warning "Preview MSIX generated. Configure the three STORE_* repository variables with the exact Partner Center product identity and rerun before submitting."
          }

      - name: Skip unsigned public GitHub release
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          Write-Warning "Direct GitHub Release skipped because Artifact Signing is not configured. Microsoft Store distribution is unaffected: use the MSIX artifact in Partner Center."

      - name: Create or update signed GitHub Release
        if: steps.signing.outputs.enabled == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $title = "Image SVG Studio $tag"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
          } else {
            gh release create $tag dist/* --title $title --generate-notes --target "${{ github.sha }}"
          }
